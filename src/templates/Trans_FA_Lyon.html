                    <div class="title">
                        PAS D'ANARCHISME SANS LES PERSONNES
                        <div style="background-image: -webkit-gradient(linear, left top, right top, color-stop(0, #5BCDF9), color-stop(30%, #F4A8B8), color-stop(40%, black), color-stop(60%, #F4A8B8), color-stop(100%, #5BCDF9));

                    <div class="subtitle" > Introduction à l'inclusion 
                        inconditionnelle des personnes trans dans les luttes anarchistes<br />
                        Darline, liaison Commune de Lyon
                        <br />
                        Livret diffusé à Lyon
                    </div>

                    <div class="description"  style="text-align: justify;font-size:19px;background: transparent;line-height: 105%;margin-bottom: 30%;>
Entrée récemment dans les mouvements anarchistes, c’est avec étonnement que je constate un certain retard sur la théorie queer et sur la trans-identité. Nombreux·sessont les anarchistes sceptiques, voire ouvertement critiques. Pourtant, ces idées sont intrinsèquement libertaires : elles brisent des normes strictes et arbitraires, donnent des droits à des minorités et développent l’autodétermination[1](#sdfootnote1sym). C’est un combat pourdavantagede libertés. Malgrécela, une certaine méfiance persiste.L’absence de positionnement clairdes anarchistesest dangereuse : chez les féministes, la transphobiepolarise déjà lesmilitant·es et personnalités publiques d’un bord à l'autre de l’échiquier politique[2](#sdfootnote2sym) ; chez les anarchistes, cela fait perdre sa crédibilité au mouvement, notamment auprès des concerné·es qui s’y sentent exclu·es ; et en général, la transphobie permet de nombreuses dérives qui atteignent d’autres minorités.

  

Pourtant, ce sujet occupe les espaces militants et politiques depuis des décennies. Non seulement la trans-identité n’est pas« un phénomène récent »– les premières traces connues remontent à l’antiquité[3](#sdfootnote3sym) – mais plus récemment, les premiers droits des personnes queers ont été gagnés par la lutte lors des émeutes de Stonewall[4](#sdfootnote4sym) grâce à des femmes trans, comme la militante emblématique Marsha P. Johnson. Les droits des personnes trans sont donc indissociables de ceux des personnes queers.

  

Qu’en est-il de soi-disant protéger les droits des« vraies femmes »en excluant les femmes trans du féminisme ? C'est la stratégie de l’extrême droite : s’attaquer d’abord à une partie marginalisée des femmes avant de s’en prendre à la majorité. Et si la perte de droits d’une minorité n’est déjà pas assez horrifiante, les femmes cis, surtout celles jugées pas assez féminines, en subissent – dans une moindre mesure, certes – aussi les conséquences[5](#sdfootnote5sym).

De plus, cette rhétoriqueessentialisteest incohérente : elle devrait exiger que les hommes trans aient les mêmes droits que les femmes cis. Pourtant, en France, ce n’est pas le cas : la PMA leur est interdite[6](#sdfootnote6sym) et l’inscription de l’avortement dans la constitution s’est faite sans les inclure[7](#sdfootnote7sym). Sans étonnement, aucun mouvement anti-trans ne s’en est indigné.

  

Dans ces mêmes courants, certain·es avancent que les hommes trans seraient des lesbiennes transitionnant pour ne plus subir l’homophobie. Passons outre l’hétéro-cis-normativité et l’infantilisation, il n’est pas plus facile d’être trans que gay, lesbienne, bi- ou encore pan-sexuel·le : en 2022, parmi plus demillelois anti-queer ont été proposées par les législateur·ices auxÉtats-Unis, 65% s’attaquaient uniquement aux personnes trans[8](#sdfootnote8sym).

  

Pour en finir avec la diffamation des femmes trans, attaquons-nous à un mensonge aussi tenace qu’honteusement absurde, qu’aucun·e féministe ne pourrait croire : les femmes trans seraient des violeuses ou – pire – des hommes qui passeraient par une transition pour pouvoir violer en toute impunité. Outre la redondance avec l’accusation encore portée contre les hommes gays il y a quelques années, rappelons que 90 % des viols sont commis par une personne connue de la victime[9](#sdfootnote9sym) et que seuls 0,6 % des coupables sont condamnés[10](#sdfootnote10sym). Il est donc impensable pour un homme cis de passer par un tel parcours pour pouvoir violer en toute impunité alors qu’ils le font déjà – dans plus de 99 % des cas.

  

De plus, les femmes trans sont elles-mêmes largement victimes de violences sexistes et sexuelles.[11](#sdfootnote11sym) Et en cas de crimes avérés de leur part, la déshumanisation qu’elles subissent est à l’opposé du traitement réservé aux« bons chefs de famille qui ont dérapé ». En France, elles sont placées à l’isolement pour une durée indéfinie,« pour leur sécurité », dans des prisons pour hommes – ce en dépitdu droitinternational[12](#sdfootnote12sym). Aux États-Unis, elles sont placées dans les cellules des détenus les plus violents où elles sont violées quotidiennement.

  

Les courants anti-transaffectentaussi les enfants. La panique morale face auxendoctrinements ouauxviolences sexuelles de la part des personnes trans – ou des drag queens – est montée de toutespiècespar l’extrême droite et fait beaucoup plus réagir que les violences – avérées – de la part des institutions religieuses et/ou politiques. Quant à la transition des mineur·es,ce sontle plus souvent des bloqueurs de puberté[13](#sdfootnote13sym) qui leur sont prescritsafin de retarder des modifications corporelles irréversibles dans l’attente d’une éventuelle prise d’hormones. L’accès à ces derniers se fait uniquement avec l’accord des parents, d’un·e psychiatre et d’un·e endocrinologue à la demande de la personne. C’est aussi le cas pour les opérations de réassignation de genre. En France, seules les mammoplasties et mastectomies sont autorisées pour les mineur·es[14](#sdfootnote14sym). Cette prise en charge permet de réduire les suicides[15](#sdfootnote15sym).

  

Voilà donc une revue non exhaustive[16](#sdfootnote16sym) des différentes populations atteintes par la transphobie – en plus des personnes trans. Pourtant, en tant qu’anarchiste, je trouve cet argumentaire futile.Lesimple fait que les personnes trans soient touchées par la transphobie est suffisant pour que nous ayons à nous dresser contre celle-ci. Aucun courant anarchiste digne de ce nom ne peut imaginer une société librequi exclutune minorité. Et il n’existe aucune minorité qui soit trop minoritaire pour que l’on ne se batte pas pour elle, avec elle. Chaque personne doit être libre de toute oppression. La transphobie en est une, présente dans toutes les sphères de notre société et à tous ses niveaux : physique, mental, financier, médical, accès au logement et à l’emploi, droit à disposer de son corps et d’exister dans l’espace public, parmi tant d’autres.

  

Nous avons démontré que hiérarchiser les luttes contribue à marginaliser une population déjà vulnérable et à alimenter des discours qui non seulement soutiennent l’extrême droite mais qui entraînent aussi la mort ou le suicide de nombreuses personnes de tout genre. À l’inverse, l’intersectionnalité, prônant une lutte contre toutes les discriminations sans distinction ni priorité, peut permettre un militantisme sans exclusion ni hiérarchie. N’est-ce pas là l’essence même de l’anarchisme ?

[1](#sdfootnote1anc)Peut-on supporter l’autonomie des peuples à se définir eux-mêmes sans soutenir aussi l’autonomie des individu·es à se définir elleux-mêmes ?
